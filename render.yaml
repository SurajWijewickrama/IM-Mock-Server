# Render.com blueprint. Works when this `mock-server` folder is the repo root.
# If you instead push the whole IM repo, delete this file and create the service
# manually in the Render UI with Root Directory = mock-server.
services:
  - type: web
    name: scene-control-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Uncomment and set a value to require a token for changing scenes.
      # - key: ADMIN_TOKEN
      #   generateValue: true
